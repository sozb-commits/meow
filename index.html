<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اسمك - السيرة الذاتية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            color: white;
        }

        h1 {
            color: #333;
            margin-bottom: 5px;
        }

        .title {
            color: #667eea;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .bio {
            color: #666;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .links {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .links a {
            display: inline-block;
            padding: 12px 25px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .links a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102,126,234,0.4);
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 25px;
        }

        .skill {
            background: #f0f0ff;
            color: #667eea;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">👤</div>
        <h1>اسمك الكامل</h1>
        <p class="title">مطور ويب | مصمم | مبتكر</p>
        <p class="bio">
            مرحباً! أنا شخص شغوف بمجال التكنولوجيا، أحب بناء حلول إبداعية 
            وتحويل الأفكار إلى واقع رقمي. أهتم بالتفاصيل وأسعى دائماً للتعلم والتطوير.
        </p>

        <div class="skills">
            <span class="skill">HTML</span>
            <span class="skill">CSS</span>
            <span class="skill">JavaScript</span>
            <span class="skill">Python</span>
            <span class="skill">التصميم</span>
        </div>

        <div class="links" style="margin-top: 30px;">
            <a href="mailto:you@example.com">✉️ راسلني</a>
            <a href="https://linkedin.com/in/username" target="_blank">LinkedIn</a>
            <a href="https://github.com/username" target="_blank">GitHub</a>
        </div>
    </div>
</body>
</html>
